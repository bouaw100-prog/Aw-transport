<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - AW Transport</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-branding">
                <h1><span class="brand-aw">AW</span> TRANSPORT</h1>
                <p>VOYAGEZ. RÉSERVEZ. PARTEZ.</p>
            </div>
            <div class="auth-illustration">
                <i class="ti ti-bus"></i>
                <h2>Bienvenue !</h2>
                <p>Connectez-vous pour réserver vos trajets en toute simplicité</p>
            </div>
        </div>
        
        <div class="auth-right">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h2>Connexion</h2>
                    <p>Bon retour parmi nous !</p>
                </div>
                
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="phone">
                            <i class="ti ti-phone"></i> Numéro de téléphone
                        </label>
                        <input 
                            type="tel" 
                            id="phone" 
                            placeholder="+221 XX XXX XXXX" 
                            required
                            pattern="^\+221\s?\d{2}\s?\d{3}\s?\d{4}$"
                        >
                        <small class="form-hint">Format: +221 XX XXX XXXX</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">
                            <i class="ti ti-lock"></i> Mot de passe
                        </label>
                        <div class="password-input">
                            <input 
                                type="password" 
                                id="password" 
                                placeholder="Votre mot de passe" 
                                required
                                minlength="6"
                            >
                            <button type="button" class="toggle-password" id="toggle-password">
                                <i class="ti ti-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            <span>Se souvenir de moi</span>
                        </label>
                        <a href="#" class="link">Mot de passe oublié ?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-large btn-block">
                        <i class="ti ti-login"></i> Se connecter
                    </button>
                </form>
                
                <div class="auth-divider">
                    <span>ou</span>
                </div>
                
                <div class="auth-footer">
                    <p>Pas encore de compte ? <a href="register.html" class="link-primary">S'inscrire</a></p>
                </div>
                
                <div class="back-home">
                    <a href="index.html" class="link">
                        <i class="ti ti-arrow-left"></i> Retour à l'accueil
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
